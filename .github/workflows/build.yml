
name: Build NuGet Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Pack
    runs-on: ubuntu-latest

    env:
  	  PROJECT_PATH: src/main/JuliHyro.Event.Lib/JuliHyro.Event.Lib.csproj
  	  OUTPUT_PATH: ./artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore "$PROJECT_PATH"

      - name: Build library
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack "$PROJECT_PATH" --configuration Release --no-build --output "$OUTPUT_PATH"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: JuliHyro.Event.Lib-NuGet
          path: artifacts/*.nupkg
          if-no-files-found: error
